<script type="module">
import * as THREE from 'three';
import { OrbitControls } from './OrbitControls.js';
import { RoomEnvironment } from './RoomEnvironment.js';

const ZONE = {
  fresh:    { color: 0x2ea043, label: '生鲜' },
  food:     { color: 0xd29922, label: '食品' },
  'non-food': { color: 0x8b949e, label: '非食品' },
  apparel:  { color: 0xbc8cff, label: '服装' },
};
const LAYER_H = 0.35, WALL_H = 3.4;
let scene, camera, renderer, controls, clock;
let shelfMeshes = [], roofGroup = null, lightStrips = [];
let heatOn = false, plano = null, introT = 0;
let flow = null, flowOn = false, flowGroup = null, dots = null, dotState = [];
let opt = null, optOn = false;
const SKU_PALETTE = [0xff6b6b, 0xffd166, 0x06d6a0, 0x4cc9f0, 0xb388ff, 0xf783ac, 0x90e000, 0xff9e00];

/* ---------- 程序化纹理 ---------- */
function floorTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#20242c'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 4; i++) {                       // 木地板条
    g.fillStyle = i % 2 ? '#232833' : '#1f232d';
    g.fillRect(0, i * 64, 256, 62);
    g.strokeStyle = 'rgba(0,0,0,.35)'; g.strokeRect(-1, i * 64, 258, 63);
  }
  for (let i = 0; i < 400; i++) {                     // 噪点
    g.fillStyle = `rgba(255,255,255,${Math.random() * 0.025})`;
    g.fillRect(Math.random() * 256, Math.random() * 256, 2, 2);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(8, 8);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function zoneLabelTexture(text, colorCss) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 128;
  const g = c.getContext('2d');
  g.font = '600 72px "Segoe UI","Microsoft YaHei",sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = colorCss; g.globalAlpha = 0.9;
  g.fillText(text, 256, 64);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function signTexture(text) {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#10131a'; g.fillRect(0, 0, 1024, 128);
  g.font = '700 84px "Segoe UI","Microsoft YaHei",sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = '#e4022b';
  g.shadowColor = '#e4022b'; g.shadowBlur = 26;
  g.fillText(text, 512, 66);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* ---------- 场景 ---------- */
function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b0e13);
  scene.fog = new THREE.Fog(0x0b0e13, 120, 420);
  clock = new THREE.Clock();

  camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.1, 800);
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  document.getElementById('canvas-wrap').appendChild(renderer.domElement);

  // 环境反射（金属/塑料质感来源）
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.maxPolarAngle = Math.PI * 0.495;

  // 灯光：半球底光 + 主阳光（投影）+ 入口补光
  scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x30281e, 0.5));
  const sun = new THREE.DirectionalLight(0xfff2e0, 2.2);
  sun.position.set(40, 60, 25);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.bias = -0.0004;
  scene.add(sun);
  scene.sun = sun;
  const doorLight = new THREE.PointLight(0x9ecbff, 30, 40);
  scene.add(doorLight);
  scene.doorLight = doorLight;

  scene.add(new THREE.GridHelper(300, 60, 0x1c2128, 0x14181e));

  renderer.domElement.addEventListener('click', onClick);
  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
  animate();
}

function heatColor(v) {  // 冷蓝 -> 火红
  return new THREE.Color().setHSL(0.62 - 0.62 * v, 0.85, 0.5);
}

function buildStore(data) {
  // 清场
  if (scene.storeGroup) scene.remove(scene.storeGroup);
  shelfMeshes = []; lightStrips = [];
  const G = scene.storeGroup = new THREE.Group();
  scene.add(G);

  const W = data.footprint.w, H = data.footprint.h;
  document.getElementById('store-name').textContent =
    `${data.store_name}（${W} × ${H} m）`;

  // 地板
  const floor = new THREE.Mesh(
    new THREE.BoxGeometry(W, 0.12, H),
    new THREE.MeshStandardMaterial({ map: floorTexture(), roughness: 0.9, metalness: 0.05 }));
  floor.position.set(W / 2, -0.06, H / 2);
  floor.receiveShadow = true;
  G.add(floor);

  // 外墙（南墙留入口）
  const wallMat = new THREE.MeshStandardMaterial({ color: 0x39404c, roughness: 0.85 });
  const mk = (w, h, d, x, y, z, mat) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat || wallMat);
    m.position.set(x, y, z);
    m.castShadow = m.receiveShadow = true;
    G.add(m); return m;
  };
  const t = 0.18, doorW = 6;
  const ex = data.entrance.x;
  mk(W, WALL_H, t, W / 2, WALL_H / 2, t / 2);                       // 北
  mk(ex - doorW / 2, WALL_H, t, (ex - doorW / 2) / 2, WALL_H / 2, H - t / 2);  // 南左
  mk(W - ex - doorW / 2, WALL_H, t, (W + ex + doorW / 2) / 2, WALL_H / 2, H - t / 2); // 南右
  mk(t, WALL_H, H, t / 2, WALL_H / 2, H / 2);                       // 西
  mk(t, WALL_H, H, W - t / 2, WALL_H / 2, H / 2);                   // 东

  // 入口玻璃门 + 门头招牌
  const glass = new THREE.Mesh(new THREE.BoxGeometry(doorW, 2.6, 0.06),
    new THREE.MeshStandardMaterial({ color: 0x88bbee, transparent: true, opacity: 0.28, roughness: 0.05, metalness: 0.9 }));
  glass.position.set(ex, 1.3, H - t / 2);
  G.add(glass);
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(doorW + 2, 0.9),
    new THREE.MeshBasicMaterial({ map: signTexture(data.store_name), transparent: true }));
  sign.position.set(ex, 3.0, H + 0.12);
  sign.rotation.y = Math.PI;
  G.add(sign);

  // 天花灯带
  const stripMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xfff4d6, emissiveIntensity: 1.6 });
  const rows = Math.max(2, Math.floor(H / 8));
  for (let i = 0; i < rows; i++) {
    const s = new THREE.Mesh(new THREE.BoxGeometry(W * 0.9, 0.06, 0.35), stripMat.clone());
    s.position.set(W / 2, WALL_H - 0.05, H * (i + 0.5) / rows);
    G.add(s); lightStrips.push(s);
  }

  // 屋顶（可切换）
  roofGroup = new THREE.Group();
  const roof = new THREE.Mesh(new THREE.BoxGeometry(W + 0.4, 0.15, H + 0.4),
    new THREE.MeshStandardMaterial({ color: 0x232830, roughness: 0.95, transparent: true, opacity: 0.0 }));
  roof.position.set(W / 2, WALL_H + 0.08, H / 2);
  roofGroup.add(roof);
  roofGroup.userData.roof = roof;
  G.add(roofGroup);

  // 区域地标 + 通道感
  Object.entries(data.zones).forEach(([z, zr]) => {
    const zone = ZONE[z] || { color: 0x666666, label: z };
    const label = new THREE.Mesh(new THREE.PlaneGeometry(Math.min(zr.w * 0.8, 14), 2.2),
      new THREE.MeshBasicMaterial({ map: zoneLabelTexture(zone.label, '#' + zone.color.toString(16).padStart(6, '0')), transparent: true, opacity: 0.55 }));
    label.rotation.x = -Math.PI / 2;
    label.position.set(zr.x + zr.w / 2, 0.02, 1.4);
    G.add(label);
  });

  // 货架：主体 + 顶帽沿，双材质层次
  const shelfGeo = new THREE.BoxGeometry(1, 1, 1);
  data.shelves.forEach(s => {
    const hgt = s.layer_count * LAYER_H;
    const zone = ZONE[s.zone] || { color: 0x888888 };
    const bodyMat = new THREE.MeshStandardMaterial({
      color: heatOn ? heatColor(s.heat_value) : zone.color,
      roughness: 0.7, metalness: 0.12,
    });
    const body = new THREE.Mesh(shelfGeo, bodyMat);
    body.scale.set(s.w * 0.94, hgt, s.h * 0.88);
    body.position.set(s.x + s.w / 2, hgt / 2, s.y);
    body.castShadow = body.receiveShadow = true;
    body.userData = s;
    G.add(body);
    shelfMeshes.push(body);

    // 层板线条（白色细条，强化"货架"识别度与层数感；纯装饰不入 raycast/着色列表）
    for (let l = 1; l < s.layer_count; l++) {
      const slab = new THREE.Mesh(shelfGeo, new THREE.MeshStandardMaterial({ color: 0xc9d1d9, roughness: 0.55 }));
      slab.scale.set(s.w * 0.96, 0.02, s.h * 0.92);
      slab.position.set(s.x + s.w / 2, l * LAYER_H, s.y);
      G.add(slab);
    }

    const cap = new THREE.Mesh(shelfGeo, new THREE.MeshStandardMaterial({ color: 0xd8dee6, roughness: 0.5, metalness: 0.35 }));
    cap.scale.set(s.w, 0.05, s.h);
    cap.position.set(s.x + s.w / 2, hgt + 0.025, s.y);
    cap.castShadow = true;
    cap.userData = { ...s, isCap: true };
    G.add(cap);
    shelfMeshes.push(cap);
  });

  // 灯光与相机定位
  scene.sun.target = floor;
  scene.sun.shadow.camera.left = -W; scene.sun.shadow.camera.right = W;
  scene.sun.shadow.camera.top = H; scene.sun.shadow.camera.bottom = -H;
  scene.doorLight.position.set(ex, 2.8, H + 2);

  camera.position.set(W / 2, Math.max(W, H) * 1.6, H * 2.2);
  controls.target.set(W / 2, 1, H / 2);
  introT = 0; // 触发开场运镜

  const l = document.getElementById('loading');
  l.style.opacity = 0; setTimeout(() => l.remove(), 700);
}

async function load(store) {
  const l = document.getElementById('loading');
  if (!l) {
    const d = document.createElement('div'); d.id = 'loading'; d.textContent = '切换门店 …';
    document.body.appendChild(d);
  } else { l.style.opacity = 1; }
  // 主数据（planogram）失败才阻断；flow/optimize 失败仅降级对应功能
  let pl;
  try {
    pl = await (await fetch(`../twin/data/planogram-${store}.json`)).json();
  } catch (e) {
    const el = document.getElementById('loading');
    el.textContent = `布局数据加载失败（${e.message || e}）— 请确认已运行 python -m nbo.twin`;
    el.style.color = '#f85149';
    return;
  }
  plano = pl;
  buildStore(plano);
  const [fl, op] = await Promise.all([
    fetch(`../twin/data/flow-${store}.json`).then(r => r.ok ? r.json() : null).catch(() => null),
    fetch(`../twin/data/optimize-${store}.json`).then(r => r.ok ? r.json() : null).catch(() => null),
  ]);
  flow = fl; opt = op;
  if (flow) buildFlow();
  if (optOn && opt) applyOptColors();
}

/* ---------- 客流：地面热力叠加 + 寻路顾客点 ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function buildFlow() {
  if (flowGroup) { scene.remove(flowGroup); flowGroup = null; dots = null; }
  if (!flow) return;
  flowGroup = new THREE.Group();
  flowGroup.visible = flowOn;
  const W = plano.footprint.w, H = plano.footprint.h;

  // 地面热力：grid counts -> canvas 纹理
  const g = flow.grid;
  const c = document.createElement('canvas');
  c.width = g.cols; c.height = g.rows;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(g.cols, g.rows);
  const max = Math.max(...g.counts, 1);
  for (let i = 0; i < g.counts.length; i++) {
    const v = Math.pow(g.counts[i] / max, 0.55);       // 伽马提亮暗部
    const hue = 210 - 210 * v;
    const rgb = hslToRgb(hue / 360, 0.9, 0.35 + 0.25 * v);
    img.data[i * 4] = rgb[0]; img.data[i * 4 + 1] = rgb[1]; img.data[i * 4 + 2] = rgb[2];
    img.data[i * 4 + 3] = g.counts[i] > 0 ? 200 : 0;
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const heatPlane = new THREE.Mesh(new THREE.PlaneGeometry(W, H),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
  heatPlane.rotation.x = -Math.PI / 2;
  heatPlane.position.set(W / 2, 0.03, H / 2);
  flowGroup.add(heatPlane);

  // 顾客点：L 型寻路游走（与引擎同几何），到出口后重生
  const N = Math.min(90, Math.max(40, flow.waypoints.length));
  const rng = mulberry32(20261019);
  const pos = new Float32Array(N * 3);
  dotState = [];
  const pick = () => {
    const zones = Object.keys(flow.zone_weights);
    const z = zones[Math.floor(rng() * zones.length)];
    const cands = flow.waypoints.filter(w => w.zone === z);
    return cands[Math.floor(rng() * cands.length)] || flow.waypoints[0];
  };
  for (let i = 0; i < N; i++) {
    const st = { x: flow.entrance.x, y: flow.entrance.y, tgt: pick(), speed: 1.0 + rng() * 0.7, phase: rng() };
    dotState.push(st);
    pos[i * 3] = st.x; pos[i * 3 + 1] = 1.1; pos[i * 3 + 2] = st.y;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  dots = new THREE.Points(geo, new THREE.PointsMaterial({
    color: 0x7fd4ff, size: 0.32, transparent: true, opacity: 0.95,
    blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true }));
  flowGroup.add(dots);
  scene.add(flowGroup);
}

function hslToRgb(h, s, l) {
  const f = n => {
    const k = (n + h * 12) % 12;
    return l - s * Math.min(l, 1 - l) * Math.max(-1, Math.min(k - 3, 9 - k, 1));
  };
  return [Math.round(f(0) * 255), Math.round(f(8) * 255), Math.round(f(4) * 255)];
}

function updateFlow(dt, time) {
  if (!flowOn || !dots) return;
  const pos = dots.geometry.attributes.position;
  for (let i = 0; i < dotState.length; i++) {
    const st = dotState[i];
    let dx = st.tgt.x - st.x, dy = st.tgt.y - st.y;
    const step = st.speed * dt;
    if (Math.abs(dy) > 0.06) {                          // L 型：先竖后横，不穿货架
      st.y += Math.sign(dy) * Math.min(Math.abs(dy), step);
    } else if (Math.abs(dx) > 0.06) {
      st.x += Math.sign(dx) * Math.min(Math.abs(dx), step);
    } else {
      // 到达 waypoint：标记离场则重生，否则按区域权重继续逛
      if (st.exiting) {
        st.exiting = false;
        st.x = flow.entrance.x; st.y = flow.entrance.y;
      }
      if (Math.random() < 0.06) {
        st.tgt = { x: flow.entrance.x, y: flow.entrance.y };
        st.exiting = true;
      } else {
        const zones = Object.keys(flow.zone_weights);
        const z = zones[Math.floor(Math.random() * zones.length)];
        const cands = flow.waypoints.filter(w => w.zone === z);
        st.tgt = cands[Math.floor(Math.random() * cands.length)];
      }
    }
    pos.array[i * 3] = st.x;
    pos.array[i * 3 + 1] = 1.05 + 0.12 * Math.sin(time * 6 + st.phase * 6.28);  // 行走起伏
    pos.array[i * 3 + 2] = st.y;
  }
  pos.needsUpdate = true;
}

/* ---------- 交互 ---------- */
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
function onClick(e) {
  mouse.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(shelfMeshes)[0];
  const info = document.getElementById('info');
  shelfMeshes.forEach(m => { if (m.material.emissive) m.material.emissive.setHex(0x000000); });
  if (hit) {
    const s = hit.object.userData;
    if (hit.object.material.emissive) {
      hit.object.material.emissive.setHex(0xe4022b);
      hit.object.material.emissiveIntensity = 0.4;
    }
    info.innerHTML = `<b>${s.id}</b><br>区域 ${ZONE[s.zone]?.label || s.zone} · ${s.layer_count} 层 × 0.35m<br>热力 ${s.heat_value} · 面宽 ${s.facing_width_m}m<br>坐标 (${s.x}, ${s.y}) m`;
  } else {
    info.textContent = '点击货架查看详情 · 拖拽旋转 / 滚轮缩放 / 右键平移';
  }
}

document.getElementById('store-sel').onchange = e => load(e.target.value);
document.getElementById('toggle-flow').onclick = e => {
  flowOn = !flowOn;
  e.target.classList.toggle('on', flowOn);
  if (flowGroup) flowGroup.visible = flowOn;
};

/* ---------- 空间优化对比：MILP 分配着色 + 收益面板 ---------- */
function applyOptColors() {
  const domMap = {};
  (opt.alloc || []).forEach(r => { if (r.dominant_sku) domMap[r.shelf_id] = r.dominant_sku; });
  const skuIndex = {};
  (opt.skus || []).forEach((s, i) => skuIndex[s.id] = SKU_PALETTE[i % SKU_PALETTE.length]);
  const unalloc = new THREE.Color(0x2a2f38);
  shelfMeshes.forEach(m => {
    const s = m.userData;
    if (!s || !m.material.color) return;
    if (!m.userData.isCap) {   // 只染货架主体，不染顶帽沿
      const sku = domMap[s.id];
      m.material.color.set(sku ? skuIndex[sku] : unalloc);
    }
  });
  const fmt = v => Math.round(v / 1000) + 'K';
  document.getElementById('info').innerHTML =
    `<b>MILP 空间优化结果（${opt.status}）</b><br>` +
    `预期日毛利 ${fmt(opt.profit_before_idr)} → <b>${fmt(opt.profit_after_idr)} IDR</b>` +
    `（${opt.uplift > 0 ? '+' : ''}${(opt.uplift * 100).toFixed(1)}%）<br>` +
    `着色 = 各货架主导 SKU · 深灰 = 优化后空置面位<br>` +
    `<span style="color:#8b949e">再次点击按钮回到区域配色</span>`;
}
function revertColors() {
  shelfMeshes.forEach(m => {
    const s = m.userData;
    if (s && m.material.color) m.material.color.setHex(ZONE[s.zone]?.color || 0x888888);
  });
  document.getElementById('info').textContent = '点击货架查看详情 · 拖拽旋转 / 滚轮缩放 / 右键平移';
}
document.getElementById('toggle-opt').onclick = e => {
  optOn = !optOn;
  e.target.classList.toggle('on', optOn);
  if (optOn) applyOptColors(); else revertColors();
};
document.getElementById('toggle-heat').onclick = e => {
  heatOn = !heatOn;
  e.target.classList.toggle('on', heatOn);
  shelfMeshes.forEach(m => {
    const s = m.userData;
    if (!s || !m.material.color) return;
    if (heatOn) m.material.color.copy(heatColor(s.heat_value));
    else m.material.color.setHex(ZONE[s.zone]?.color || 0x888888);
  });
};
document.getElementById('toggle-spin').onclick = e => {
  controls.autoRotate = !controls.autoRotate;
  controls.autoRotateSpeed = 0.9;
  e.target.classList.toggle('on', controls.autoRotate);
};
document.getElementById('toggle-roof').onclick = e => {
  const roof = roofGroup.userData.roof;
  roof.material.opacity = roof.material.opacity > 0.05 ? 0.0 : 0.92;
  e.target.classList.toggle('on', roof.material.opacity > 0.05);
};

/* ---------- 主循环：阻尼 + 热力脉冲 + 开场运镜 + 灯带闪烁 ---------- */
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta(), time = clock.elapsedTime;
  if (introT < 1 && plano) {                      // 2 秒开场推镜
    introT = Math.min(1, introT + dt / 2.2);
    const k = 1 - Math.pow(1 - introT, 3);
    const W = plano.footprint.w, H = plano.footprint.h;
    camera.position.lerp(new THREE.Vector3(W * 1.05, Math.max(W, H) * 0.75, H * 1.5), k * 0.12);
  }
  if (heatOn) {
    const pulse = 0.25 + 0.18 * Math.sin(time * 2.2);
    shelfMeshes.forEach(m => {
      if (m.material.emissive && m.userData) {
        m.material.emissive.copy(m.material.color).multiplyScalar(pulse);
      }
    });
  }
  updateFlow(dt, time);
  lightStrips.forEach((s, i) => { s.material.emissiveIntensity = 1.55 + 0.08 * Math.sin(time * 3 + i * 1.7); });
  controls.update();
  renderer.render(scene, camera);
}

init();
const qsStore = new URLSearchParams(location.search).get('store');
const qsZone = new URLSearchParams(location.search).get('zone');
const qsLabel = new URLSearchParams(location.search).get('label');
load(qsStore || '2000').then(applyZoneHighlight);
if (qsStore) document.getElementById('store-sel').value = qsStore;

/* 品类聚焦：?zone=food&label=xxx → 目标分区红色高亮，其余调暗 */
function applyZoneHighlight() {
  if (!qsZone || !plano) return;
  shelfMeshes.forEach(m => {
    const s = m.userData;
    if (!s || s.isCap) return;
    if (s.zone === qsZone) {
      m.material.emissive.setHex(0xe4022b);
      m.material.emissiveIntensity = 0.35;
    } else {
      m.material.transparent = true;
      m.material.opacity = 0.14;
    }
  });
  document.getElementById('info').innerHTML =
    `<b>品类聚焦 · ${qsLabel || qsZone}</b><br>红色高亮 = 目标分区货架（${qsZone}），其余已调暗`;
}
