<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>渠道地图 · Nusantara Brand OS</title>
<link rel="stylesheet" href="./leaflet.css">
<script src="./leaflet.js"></script>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --line:#2d333b; --text:#e6edf3; --dim:#8b949e;
          --gold:#ffd700; --silver:#c0c0c0; --potential:#d29922; --normal:#6e7681;
          --comp:#58a6ff; --red:#f85149; --green:#3fb950; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif; display:flex; height:100vh; }
  #map { flex:1; background:#0a0e14; }
  #side { width:372px; min-width:372px; overflow-y:auto; border-left:1px solid var(--line); padding:16px 16px 24px; }
  h1 { font-size:17px; margin-bottom:2px; }
  .meta { color:var(--dim); font-size:12px; margin-bottom:12px; }
  .kpi { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px; }
  .kpi .item { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  .kpi .v { font-size:20px; font-weight:700; }
  .kpi .l { color:var(--dim); font-size:12px; }
  h2 { font-size:13px; color:var(--dim); margin:16px 0 8px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
  .chip { background:var(--panel); border:1px solid var(--line); color:var(--dim); border-radius:999px;
          padding:4px 12px; font-size:12px; cursor:pointer; }
  .chip.on { color:var(--text); border-color:var(--comp); background:rgba(88,166,255,.12); }
  .gap { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:8px; font-size:13px; cursor:pointer; }
  .gap:hover { border-color:var(--gold); }
  .gap .top { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
  .gap .rank { color:var(--dim); font-family:Consolas,monospace; font-size:12px; min-width:20px; }
  .gap .badge { font-size:11px; padding:1px 8px; border-radius:999px; font-weight:600; }
  .badge.gold { background:rgba(255,215,0,.15); color:var(--gold); }
  .badge.silver { background:rgba(192,192,192,.15); color:var(--silver); }
  .badge.potential { background:rgba(210,153,34,.15); color:var(--potential); }
  .badge.normal { background:rgba(110,118,129,.2); color:var(--dim); }
  .badge.step { background:rgba(63,185,80,.15); color:var(--green); }
  .gap .name { font-weight:600; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .gap .sub { color:var(--dim); font-size:12px; display:flex; align-items:center; gap:8px; }
  .bar { flex:1; height:6px; background:#21262d; border-radius:3px; overflow:hidden; }
  .bar i { display:block; height:100%; background:linear-gradient(90deg,var(--comp),#79c0ff); }
  .gap .cta { display:inline-block; margin-top:8px; font-size:12px; color:#3fb950; text-decoration:none;
              border:1px solid rgba(63,185,80,.4); border-radius:6px; padding:3px 10px; }
  .gap .cta:hover { background:rgba(63,185,80,.12); }
  .legend { position:absolute; bottom:20px; left:12px; z-index:1000; background:rgba(22,27,34,.92); border:1px solid var(--line);
            border-radius:8px; padding:10px 12px; font-size:12px; color:var(--dim); }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; }
  .legend i.sq { border-radius:2px; }
  .layers { position:absolute; top:12px; right:12px; z-index:1000; background:rgba(22,27,34,.92); border:1px solid var(--line);
            border-radius:8px; padding:8px 12px; font-size:12px; color:var(--dim); }
  .layers label { display:flex; align-items:center; gap:6px; cursor:pointer; padding:2px 0; }
  /* popup 7 维迷你条 */
  .pop { min-width:220px; font-family:inherit; }
  .pop .t { font-weight:700; margin-bottom:2px; }
  .pop .s { color:#8b949e; font-size:12px; margin-bottom:6px; }
  .pop .d { display:flex; align-items:center; gap:6px; font-size:11px; margin:2px 0; }
  .pop .d .n { width:34px; color:#8b949e; }
  .pop .d .bar { height:5px; }
  .pop .d .v { width:22px; text-align:right; color:#e6edf3; }
  .leaflet-popup-content-wrapper { background:#161b22; color:#e6edf3; border:1px solid #2d333b; border-radius:8px; }
  .leaflet-popup-tip { background:#161b22; }
  .leaflet-popup-close-button { color:#8b949e !important; }
  .leaflet-container { background:#0a0e14; }
</style>
</head>
<body>
<div id="map"></div>
<div class="legend" id="legend"></div>
<div class="layers">
  <label><input type="checkbox" id="covToggle"> 竞品覆盖圈（500m）</label>
  <label><input type="checkbox" id="gapToggle" checked> 仅显示缺口候选</label>
</div>
<div id="side">
  <h1>渠道地图</h1>
  <div class="meta" id="meta"></div>
  <div class="kpi" id="kpis"></div>
  <h2>覆盖缺口 · 优先铺货清单</h2>
  <div class="chips" id="cityChips"></div>
  <div id="gaps"></div>
</div>

<script>
const GRADE_COLOR = { gold: '#ffd700', silver: '#c0c0c0', potential: '#d29922', normal: '#6e7681' };
const COMP_COLOR = { alfamart: '#58a6ff', indomaret: '#bc8cff' };
const GRADE_LABEL = { gold: '黄金', silver: '白银', potential: '潜力', normal: '普通' };
const DIM_LABEL = { location: '位置', activity: '活跃度', competition: '竞争', cooperation: '合作',
                    digital: '数字化', owner: '店主', region: '区域' };

document.getElementById('legend').innerHTML =
  ['gold','silver','potential','normal'].map(g => `<div><i style="background:${GRADE_COLOR[g]}"></i>Warung ${GRADE_LABEL[g]}</div>`).join('') +
  Object.entries(COMP_COLOR).map(([t, c]) => `<div><i class="sq" style="background:${c}"></i>${t}（竞品）</div>`).join('');

fetch('./data/channel_map.json').then(r => {
  if (!r.ok) throw new Error(`channel_map.json 加载失败: ${r.status}（请先生成：python -m nbo.channel --out web/map/data/channel_map.json）`);
  return r.json();
}).then(d => {
  document.getElementById('meta').textContent =
    `生成 ${d.generated_at} · 竞品半径 ${d.params.radius_m}m · 数据模型对齐 WarungScout`;

  const k = d.kpis;
  document.getElementById('kpis').innerHTML = [
    [k.warung_count, 'Warung 点位'], [k.gold_silver, '黄金+白银'],
    [k.competitor_count, '现代渠道竞品'], [k.gap_count, '覆盖缺口'],
  ].map(([v, l]) => `<div class="item"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('');

  const map = L.map('map', { zoomControl: true }).setView([-6.35, 106.85], 11);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19, attribution: 'Esri（正式环境切 Mapbox/自托管切片）'
  }).addTo(map);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19
  }).addTo(map);

  const warungLayer = L.layerGroup().addTo(map);
  const compLayer = L.layerGroup().addTo(map);
  const covLayer = L.layerGroup();

  const popupHtml = p => {
    const dims = Object.entries(p.dims || {}).map(([n, v]) =>
      `<div class="d"><span class="n">${DIM_LABEL[n] || n}</span><span class="bar"><i style="width:${v}%"></i></span><span class="v">${v}</span></div>`
    ).join('');
    return `<div class="pop"><div class="t">${p.name}</div>` +
      `<div class="s">${p.grade_label || ''} · ${p.final_score} 分 · 步骤 ${p.sales_step} · 500m 内竞品 ${p.competitors_within ?? '-'} 家</div>` +
      dims + `</div>`;
  };

  const compIcon = (type, name) => L.divIcon({
    className: '', iconSize: [14, 14],
    html: `<div title="${name}" style="width:14px;height:14px;background:${COMP_COLOR[type] || '#58a6ff'};` +
          `border:2px solid #0d1117;border-radius:3px;box-shadow:0 0 6px ${COMP_COLOR[type] || '#58a6ff'}88"></div>`
  });

  d.points.forEach(p => {
    if (p.type === 'warung') {
      const m = L.circleMarker([p.lat, p.lon], {
        radius: 4 + p.final_score / 9, color: GRADE_COLOR[p.grade], weight: 2,
        fillColor: GRADE_COLOR[p.grade], fillOpacity: 0.38
      }).bindPopup(popupHtml(p));
      m._gapCandidate = d.gaps.some(g => g.id === p.id);
      warungLayer.addLayer(m);
    } else {
      compLayer.addLayer(L.marker([p.lat, p.lon], { icon: compIcon(p.type, p.name) })
        .bindPopup(`<b>${p.name}</b><br>现代渠道竞品（${p.type}）`));
      L.circle([p.lat, p.lon], { radius: d.params.radius_m, color: '#58a6ff', weight: 1,
        fillColor: '#58a6ff', fillOpacity: 0.05, opacity: 0.35 }).addTo(covLayer);
    }
  });

  // 侧栏：城市过滤 chips + 缺口清单（排名 / 徽章 / 评分条 / WhatsApp CTA）
  const cities = [...new Set(d.gaps.map(g => g.city || '未知'))];
  let cityFilter = '全部';
  const chipsEl = document.getElementById('cityChips');
  const renderChips = () => {
    chipsEl.innerHTML = ['全部', ...cities].map(c =>
      `<span class="chip ${c === cityFilter ? 'on' : ''}" data-c="${c}">${c}</span>`).join('');
    chipsEl.querySelectorAll('.chip').forEach(el => el.onclick = () => { cityFilter = el.dataset.c; renderChips(); renderGaps(); });
  };
  const renderGaps = () => {
    const list = d.gaps.map((g, i) => ({ ...g, rank: i + 1 }))
      .filter(g => cityFilter === '全部' || (g.city || '未知') === cityFilter);
    document.getElementById('gaps').innerHTML = list.map(g => {
      const wa = 'https://wa.me/620000000000?text=' +
        encodeURIComponent(`Halo ${g.name}! Kami dari Nusantara Brand — 想为您铺设新品陈列（${g.city || ''}）`);
      return `<div class="gap" data-lat="${g.lat}" data-lon="${g.lon}">
        <div class="top"><span class="rank">#${g.rank}</span><span class="name">${g.name}</span>
          <span class="badge ${g.grade}">${GRADE_LABEL[g.grade]}</span><span class="badge step">步骤 ${g.sales_step}</span></div>
        <div class="sub"><span style="min-width:52px">${g.final_score} 分</span><span class="bar"><i style="width:${g.final_score}%"></i></span><span>${g.city || ''}</span></div>
        <a class="cta" href="${wa}" target="_blank" rel="noopener" onclick="event.stopPropagation()">WhatsApp 发起铺货 →</a>
      </div>`;
    }).join('') || '<div class="meta">该城市暂无缺口</div>';
    document.querySelectorAll('.gap[data-lat]').forEach(el => el.onclick = () =>
      map.flyTo([+el.dataset.lat, +el.dataset.lon], 15, { duration: 0.8 }));
  };
  renderChips(); renderGaps();

  // 覆盖圈开关
  document.getElementById('covToggle').onchange = e =>
    e.target.checked ? covLayer.addTo(map) : map.removeLayer(covLayer);
  // 仅缺口候选开关：非缺口 Warung 淡出
  document.getElementById('gapToggle').onchange = e => {
    const only = e.target.checked;
    warungLayer.eachLayer(m => {
      const on = !only || m._gapCandidate;
      m.setStyle({ opacity: on ? 1 : 0.12, fillOpacity: on ? 0.38 : 0.05 });
      if (on) m.bringToFront();
    });
  };
}).catch(e => {
  document.getElementById('side').innerHTML = `<div style="color:#f85149;padding:20px">加载失败：${e.message}</div>`;
});
</script>
</body>
</html>
