<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/ui/tokens.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<title>门店大屏 · 单店经营驾驶舱，去化补货一屏决策 | Nusantara Brand OS</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0b0f14; color:#e8eef5; font-family:'Segoe UI',system-ui,'Microsoft YaHei',sans-serif; min-height:100dvh; }
  .wrap { max-width:760px; margin:0 auto; padding:58px 16px 60px; }
  .head { margin-bottom:16px; }
  .head .tag { font-size:10.5px; letter-spacing:.14em; color:#ff5c7a; }
  .head h1 { font-size:22px; font-weight:800; margin-top:4px; }
  .head .date { color:#5b6779; font-size:11.5px; margin-top:4px; }
  .card { background:#121820; border:1px solid #1f2733; border-radius:14px; padding:16px 18px; margin-bottom:12px; }
  .card h2 { font-size:11px; letter-spacing:.1em; color:#5b6779; font-weight:600; margin-bottom:10px; }
  .big { font-size:34px; font-weight:800; font-family:Consolas,monospace; }
  .big small { font-size:13px; font-weight:400; color:#8b98a8; font-family:'Segoe UI',sans-serif; }
  .sub { color:#8b98a8; font-size:12px; margin-top:4px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .grid2 .card { margin-bottom:0; }
  .alert { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px dashed #1f2733; font-size:13px; }
  .alert:last-child { border-bottom:none; }
  .dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .dot.bad { background:#ff5c7a; box-shadow:0 0 8px rgba(255,92,122,.7); }
  .dot.high { background:#ff9a3d; }
  .dot.warn { background:#e8b246; }
  .alert .an { font-weight:700; }
  .alert .aa { color:#8b98a8; font-size:11.5px; }
  .top5 { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px dashed #1f2733; font-size:13px; }
  .top5:last-child { border-bottom:none; }
  .top5 .r { color:#e4022b; font-family:Consolas,monospace; font-weight:800; width:22px; }
  .top5 .tn { flex:1; font-weight:600; }
  .top5 .ts { color:#5b6779; font-size:11px; font-family:Consolas,monospace; }
  .reorder { display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px dashed #1f2733; font-size:13px; }
  .reorder:last-child { border-bottom:none; }
  .reorder .qty { background:rgba(52,209,123,.15); color:#34d17b; font-family:Consolas,monospace;
                  font-weight:800; padding:3px 12px; border-radius:8px; }
  .reorder .rs { color:#5b6779; font-size:10.5px; }
  .ok { color:#34d17b; font-size:13px; padding:6px 0; }
  .links { display:flex; gap:14px; margin-top:16px; justify-content:center; }
  .links a { color:#4da3ff; font-size:12px; text-decoration:none; }
  .foot { text-align:center; color:#33405a; font-size:10.5px; margin-top:18px; }
</style>
</head>
<body>
<nav class="nbo-nav" style="display:flex;gap:4px;align-items:center;padding:10px 20px;border-bottom:1px solid #1a222d;background:#0d1117;flex-wrap:nowrap;overflow-x:auto;font-size:13px;">
  <a href="/" style="color:#e4022b;font-weight:800;letter-spacing:.1em;margin-right:10px;text-decoration:none;flex:0 0 auto;">NUSANTARA BRAND OS</a>
  <span style="color:#e8b246;font-size:10px;letter-spacing:.08em;margin:0 4px 0 8px;white-space:nowrap;flex:0 0 auto;">A·网红单店</span>
  <a class="nl" data-p="trend" href="/trend/">热点雷达</a>
  <a class="nl" data-p="launch" href="/launch/">选品评分</a>
  <a class="nl" data-p="brandkit" href="/brandkit/">品牌设计</a>
  <a class="nl" data-p="assembly" href="/assembly/">开店方案</a>
  <a class="nl" data-p="store-dash" href="/store-dash/">门店大屏</a>
  <a class="nl" data-p="franchise" href="/franchise/">加盟体系</a>
  <span style="color:#4da3ff;font-size:10px;letter-spacing:.08em;margin:0 4px 0 10px;white-space:nowrap;flex:0 0 auto;">B·集装箱零售</span>
  <a class="nl bline" data-p="case" href="/case/">集装箱店</a>
  <a class="nl bline" data-p="dashboard" href="/dashboard/">库存大屏</a>
  <a class="nl bline" data-p="map" href="/map/">渠道地图</a>
  <a class="nl bline" data-p="floorplan" href="/floorplan/">平面布局</a>
  <a class="nl bline" data-p="three" href="/three/">3D 门店</a>
  <span style="color:#3a4556;font-size:10px;letter-spacing:.08em;margin:0 4px 0 10px;white-space:nowrap;flex:0 0 auto;">底座</span>
  <a class="nl" data-p="playbook" href="/playbook/">培训体系</a>
  <a class="nl" data-p="library" href="/library/">中央库</a>
</nav>
<div class="chain" style="position:fixed;top:38px;left:0;right:0;z-index:9999;display:flex;gap:6px;align-items:center;flex-wrap:nowrap;overflow-x:auto;padding:7px 20px;font-size:11.5px;color:#5b6779;border-bottom:1px solid #141a23;background:rgba(11,14,19,.92);backdrop-filter:blur(6px);">
  <span style="letter-spacing:.1em;">单店验证链路</span>
  <a href="/trend/" data-s="/trend/" style="color:#8b98a8;text-decoration:none;">① 热点雷达找货</a><span>→</span>
  <a href="/launch/" data-s="/launch/" style="color:#8b98a8;text-decoration:none;">② 选品评分定级</a><span>→</span>
  <a href="/brandkit/" data-s="/brandkit/" style="color:#8b98a8;text-decoration:none;">③ 品牌设计定装</a><span>→</span>
  <a href="/assembly/" data-s="/assembly/" style="color:#8b98a8;text-decoration:none;">④ 开店方案选型</a><span>→</span>
  <a href="/store-dash/" data-s="/store-dash/" style="color:#8b98a8;text-decoration:none;">⑤ 门店大屏运营</a>
  <script>document.querySelectorAll('.chain a').forEach(a=>{if(location.pathname.startsWith(a.dataset.s)){a.style.color='#e8b246';a.style.fontWeight='700';}});</script>
</div>
<div class="wrap">
  <div class="head">
    <div class="tag">STORE PULSE · 加盟店极简运营视图</div>
    <h1 id="store-name">—</h1>
    <div class="date" id="date"></div>
  </div>
  <div class="card">
    <h2>今日流水</h2>
    <div class="big" id="revenue"></div>
    <div class="sub" id="orders"></div>
  </div>
  <div class="grid2">
    <div class="card"><h2>待处理预警</h2><div class="big" id="alerts" style="color:#ff9a3d"></div><div class="sub">只需行动项，不看全盘</div></div>
    <div class="card"><h2>在架 SKU</h2><div class="big" id="skus" style="color:#4da3ff"></div><div class="sub" id="reorder-sub"></div></div>
  </div>
  <div class="card" style="margin-top:12px;">
    <h2>⚠ 行动预警</h2>
    <div id="alert-list"></div>
  </div>
  <div class="card">
    <h2>🏆 畅销 TOP5</h2>
    <div id="top5"></div>
  </div>
  <div class="card">
    <h2>📦 一键补货建议</h2>
    <div id="reorder"></div>
  </div>
  <div class="links">
    <a id="lk-full" href="#">查看完整大屏 →</a>
    <a id="lk-fr" href="#">加盟业态对比 →</a>
  </div>
  <div class="foot">小店模式演示数据 · 与完整去化大屏同源 · 只呈现需要行动的信息</div>
</div>
<script>
const esc = s => (s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const jt = n => 'Rp ' + (n / 1e6).toLocaleString('id-ID', {maximumFractionDigits: 2}) + ' jt';

fetch('./data/store-dash.json').then(r => r.json()).then(d => {
  document.getElementById('store-name').textContent = d.store.name;
  document.getElementById('date').textContent =
    (d.is_today ? '营业日 ' : '最近营业日 ') + d.business_date + ' · ' + d.store.concept;
  document.getElementById('revenue').innerHTML = jt(d.kpi.today_revenue) + ' <small>/ 今日</small>';
  document.getElementById('orders').textContent = d.kpi.today_orders + ' 笔订单';
  document.getElementById('alerts').textContent = d.kpi.alert_count;
  document.getElementById('skus').textContent = d.kpi.skus_on_shelf;
  document.getElementById('reorder-sub').textContent = d.kpi.reorder_lines + ' 条补货建议';
  const lvl = { bad: '紧急', high: '高', warn: '关注' };
  document.getElementById('alert-list').innerHTML = d.alerts.length
    ? d.alerts.map(a => `<div class="alert"><span class="dot ${a.level}"></span>
        <span class="an">${esc(a.name)}</span><span class="aa">${lvl[a.level] || ''} · ${esc(a.action)}</span></div>`).join('')
    : '<div class="ok">✓ 全部正常，无需行动</div>';
  document.getElementById('top5').innerHTML = d.top5.map((t, i) =>
    `<div class="top5"><span class="r">${i + 1}</span><span class="tn">${esc(t.name)}</span>
     <span class="ts">日销 ${t.avg_daily} · 存 ${t.stock}</span></div>`).join('');
  document.getElementById('reorder').innerHTML = d.reorder.length
    ? d.reorder.map(r => `<div class="reorder"><span>${esc(r.name)}<div class="rs">${esc(r.reason)}</div></span>
        <span class="qty">+${r.qty}</span></div>`).join('')
    : '<div class="ok">✓ 库存健康，暂无补货需求</div>';
  document.getElementById('lk-full').href = d.links.full_dashboard;
  document.getElementById('lk-fr').href = d.links.franchise;
});
const p = location.pathname;
document.querySelectorAll('.nbo-nav a.nl').forEach(a => { if (p.includes(a.dataset.p)) a.classList.add('on'); });
</script>
<script src="/ui/interactions.js" defer></script>
</body>
</html>
